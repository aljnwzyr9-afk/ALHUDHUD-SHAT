<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALHUDHUD SHAT</title>

<style>
    body {
        margin: 0;
        font-family: "Tahoma", sans-serif;
        background: #f0f2f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .header {
        background: #075e54;
        color: white;
        padding: 10px;
        text-align: center;
        font-weight: bold;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .header img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        margin-bottom: 5px;
    }

    .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        background: #e5ddd5;
    }

    .message {
        max-width: 75%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 10px;
        font-size: 16px;
        line-height: 1.4;
    }

    .me {
        background: #dcf8c6;
        margin-left: auto;
        text-align: right;
    }

    .other {
        background: white;
        margin-right: auto;
        text-align: left;
    }

    .input-area {
        display: flex;
        padding: 10px;
        background: white;
        border-top: 1px solid #ccc;
    }

    .input-area input {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 20px;
        outline: none;
    }

    .input-area button {
        margin-left: 10px;
        padding: 12px 20px;
        background: #128c7e;
        color: white;
        border: none;
        border-radius: 20px;
        font-size: 16px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        .header { font-size: 18px; }
        .message { font-size: 15px; }
    }
</style>
</head>

<body>

<div class="header">
    <img src="logo.jpeg" alt="شعار الهدهد">
    💬 ALHUDHUD SHAT
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
    <input type="text" id="msgInput" placeholder="اكتب رسالتك...">
    <button onclick="sendMessage()">إرسال</button>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("msgInput");
    let text = input.value.trim();
    if (text === "") return;

    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.className = "message me";
    msg.textContent = text;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    input.value = "";
}
</script>

</body>
</html>
